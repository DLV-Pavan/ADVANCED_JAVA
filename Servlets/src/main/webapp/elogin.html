<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Employee Login</title>
</head>
<body>
    <h2>Employee Login Form</h2>
    <form action="EmployeeLogin" method="get">
        <label>Employee ID:</label>
        <input type="text" name="empid" required><br><br>
        
        <label>Password:</label>
        <input type="password" name="emppass" required><br><br>
        
        <input type="submit" value="Login">
    </form>
</body>
</html>
